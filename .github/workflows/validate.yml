name: validate

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  skills:
    name: skill manifest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md manifests
        shell: pwsh
        run: .\bin\vii-validate.ps1

  setup:
    name: installer dry-run
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # -DryRun touches no files outside the workspace, so this proves the
      # installer parses and resolves paths without mutating the runner.
      - name: setup.ps1 -DryRun
        shell: pwsh
        run: .\setup.ps1 -DryRun

  scripts:
    name: powershell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every .ps1
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) {
              $bad++
              Write-Host "error $($_.FullName)" -ForegroundColor Red
              $errs | ForEach-Object { Write-Host "    $($_.Message)" }
            }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "PASSED - all .ps1 files parse" -ForegroundColor Green
