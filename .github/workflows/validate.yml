name: validate

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  skills:
    name: skill manifest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md manifests
        shell: pwsh
        run: .\bin\vii-validate.ps1

  hooks:
    name: hook behavior
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The safety hooks must block real destructive commands and must not
      # block prose that merely mentions one. Run on both shells: `powershell`
      # is Windows PowerShell 5.1, the floor the README advertises.
      - name: vii-careful-check (pwsh 7)
        shell: pwsh
        run: .\bin\vii-hook-test.ps1

      - name: vii-careful-check (Windows PowerShell 5.1)
        shell: powershell
        run: .\bin\vii-hook-test.ps1

  setup:
    name: installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # -DryRun touches no files outside the workspace, so this proves the
      # installer parses and resolves paths without mutating the runner.
      - name: setup.ps1 -DryRun
        shell: pwsh
        run: .\setup.ps1 -DryRun

      # The settings.json merge rewrites a file the installer did not create,
      # so it is tested for real against a throwaway HOME - on 5.1 especially,
      # where ConvertFrom-Json -AsHashtable does not exist.
      - name: settings.json merge (pwsh 7)
        shell: pwsh
        run: .\bin\vii-setup-test.ps1

      - name: settings.json merge (Windows PowerShell 5.1)
        shell: powershell
        run: .\bin\vii-setup-test.ps1

  scripts:
    name: powershell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every .ps1
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) {
              $bad++
              Write-Host "error $($_.FullName)" -ForegroundColor Red
              $errs | ForEach-Object { Write-Host "    $($_.Message)" }
            }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "PASSED - all .ps1 files parse" -ForegroundColor Green
